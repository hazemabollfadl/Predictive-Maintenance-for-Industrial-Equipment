name: Deploy Lambda

on:
  push:
    branches: [main]
    paths:
      - "lambda/**"
      - "scripts/compute_baselines.py"
      - ".github/workflows/deploy-lambda.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Compute baselines
        run: pip install pandas && python scripts/compute_baselines.py

      - name: Package Lambda
        run: |
          pip install -r lambda/requirements.txt -t lambda/package
          cp lambda/handler.py lambda/baselines.json lambda/package/
          cd lambda/package && zip -r ../../lambda.zip .

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION_NAME \
            --zip-file fileb://lambda.zip
